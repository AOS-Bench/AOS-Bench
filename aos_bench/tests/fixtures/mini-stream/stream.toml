version = "1.0"

[metadata]
name = "mini-stream"
description = "Minimal 2-task stream for smoke / integration testing (bash-only, no Docker tools needed)"
author = "aos-bench"

[environment]
cpus = 1
memory_mb = 512
allow_internet = false

[session]
max_steps = 10

[[arrivals]]
step = 0
task_id = "task-alpha"
deadline_step = 5

[[arrivals]]
step = 2
task_id = "task-beta"
deadline_step = 8
